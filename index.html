<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}
:root{--play:#b07d12;--play-soft:rgba(190,140,30,.20)}

.note.foot,.voice{text-align:center}.note.foot .fi{width:1.1em;height:1.1em;vertical-align:-.18em}.ver{text-align:center;font-size:11px;color:var(--muted);padding:12px 0 24px}html.tab .ver{font-size:15px}
.dlp{text-align:center;font-size:13px;margin:10px 0 0}.dla{color:var(--accent);font-weight:700;text-decoration:none}.dls{margin-left:8px;color:var(--muted);font-variant-numeric:tabular-nums}html.tab .dlp{font-size:19px}
.fbox{display:flex;flex-direction:column;gap:3px;padding-bottom:24px}.fbox>*{margin:0!important}.fbox .ver{padding:0}

.band{flex-direction:column!important;align-items:stretch!important;justify-content:flex-start!important;gap:10px}.band>*{width:100%;text-align:left;box-sizing:border-box}.band>.bigsel{text-align:center}.band .bigsel{width:100%;max-width:none;font-size:16px;font-weight:700;padding:11px 36px;background-color:var(--sheet);border-radius:12px}.band .bintro{color:var(--ink)}.band .box{background:var(--sheet)}html.tab .band .bigsel{font-size:23px;padding:14px 44px}
.band .bigsel{background-color:var(--inv);color:var(--sheet);border-color:var(--inv);background-image:linear-gradient(45deg,transparent 50%,var(--sheet) 50%),linear-gradient(135deg,var(--sheet) 50%,transparent 50%)}.band .bigsel option{background:var(--sheet);color:var(--ink,inherit)}
.controls .bact{flex:1 1 100%;order:9;display:flex;justify-content:flex-end;gap:8px;border-top:1px solid var(--line);padding-top:12px;margin-top:6px}.controls .bact:empty{display:none}
.controls .opts{display:flex;gap:6px;margin-left:auto;flex:0 0 auto}
.controls .ll{display:none}.olab{font-size:12.5px;color:var(--muted);margin:0 2px 0 6px;white-space:nowrap}.dlg-list>.bundle:first-child>.entry:first-of-type{border-top:0;padding-top:4px}
html.tab .controls .ll{display:inline } html.tab .controls .sl{display:none } html.tab .controls{justify-content:center!important;column-gap:18px } html.tab .controls .opts{margin-left:0!important;align-items:center } html.tab .controls>.seg{margin-right:0} html.tab .controls .bact{justify-content:center}
@media (hover:hover) and (pointer:fine){.controls .ll{display:inline}.controls .sl{display:none}.controls{justify-content:center!important;column-gap:18px}.controls .opts{margin-left:0!important;align-items:center}.controls>.seg{margin-right:0!important}.controls .bact{justify-content:center}}
html.tab .olab{font-size:18px}
#app[data-g="P5"]{--play:#1f6fb8;--play-soft:rgba(40,120,205,.15)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) #app[data-g="P5"]{--play:#7ab8f0;--play-soft:rgba(100,170,240,.22)}}
:root[data-theme="dark"] #app[data-g="P5"]{--play:#7ab8f0;--play-soft:rgba(100,170,240,.22)}
.band .box{gap:2px}.band .box p{line-height:1.4}
.band .bigsel{padding-top:7px!important;padding-bottom:7px!important}
.controls .bact{border-top:0!important;padding-top:2px!important}
.card{position:relative}

.card .face{padding-right:52px!important;min-height:120px}
.card.playing,.card.playing .face,.card.playing.flipped .face{background:var(--play-soft)!important}
.card.playing{border-color:var(--play)!important}
@media not ((hover:hover) and (pointer:fine)){html:not(.tab) .band .bigsel{padding-left:10px!important;padding-right:28px!important}}
.cards .face .big{margin-top:0!important;display:block;overflow:hidden;line-height:1.6}.cards .face .big.tn{position:relative;padding-top:.74em}.tm .st,.tleg .st{stroke:#b9b2a8;stroke-width:1.3}.tleg{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 12px;margin:0 0 12px;font-size:12.5px;color:var(--muted,#6b6b6b)}.tleg span{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}.tleg span{color:var(--tc)}.tleg svg{width:17px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}.big .tm{position:absolute;transform:translate(-50%,-150%);width:.54em;line-height:0;pointer-events:none}html.tab .tleg{font-size:15px;gap:5px 16px}html.tab .tleg svg{width:21px}.big .tm svg{display:block;width:100%;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}[data-tn=t3]{--tc:#d9304a}[data-tn=t1]{--tc:#2b8a3e}[data-tn=t5]{--tc:#1c6fc4}[data-tn=t4]{--tc:#e06c00}[data-tn=t2]{--tc:#8f3bb8}[data-tn=t6]{--tc:#0b8a8f}.big .tm{color:var(--tc)}
/* v2.13 RYU: tone marks on the word heads in 예문보기 too (not on sentences) */
.entry-head .w.tn{position:relative;display:inline-block;padding-top:.62em;line-height:1.5}
.entry-head .w .tm{position:absolute;transform:translate(-50%,-150%);width:.54em;line-height:0;pointer-events:none;color:var(--tc)}
.entry-head .w .tm svg{display:block;width:100%;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) [data-tn=t3]{--tc:#ff8fa0}:root:not([data-theme="light"]) [data-tn=t1]{--tc:#7fd88f}:root:not([data-theme="light"]) [data-tn=t5]{--tc:#7fbcff}:root:not([data-theme="light"]) [data-tn=t4]{--tc:#ffb04d}:root:not([data-theme="light"]) [data-tn=t2]{--tc:#d7a0f5}:root:not([data-theme="light"]) [data-tn=t6]{--tc:#6fdadf}}:root[data-theme="dark"] [data-tn=t3]{--tc:#ff8fa0}:root[data-theme="dark"] [data-tn=t1]{--tc:#7fd88f}:root[data-theme="dark"] [data-tn=t5]{--tc:#7fbcff}:root[data-theme="dark"] [data-tn=t4]{--tc:#ffb04d}:root[data-theme="dark"] [data-tn=t2]{--tc:#d7a0f5}:root[data-theme="dark"] [data-tn=t6]{--tc:#6fdadf}.cards .face .hint{margin-bottom:0!important}.cards .face>.fr{justify-content:flex-start}
.sub{min-width:0!important;padding:6px 10px 7px!important}

.box.rel ul{list-style:none;padding-left:0!important}.box.rel li{font-size:13px}html.tab .box.rel li{font-size:19px}

/* v2.31 RYU: selected options and menu buttons shown inverted; v2.32 softer (--inv = accent mixed toward the sheet) */
:root,#app{--inv:var(--accent)}@supports (background:color-mix(in srgb,red 50%,blue)){:root,#app,#app[data-g]{--inv:color-mix(in srgb,var(--accent) 34%,var(--sheet))}}
.seg button[aria-pressed="true"]{background:var(--inv)!important;color:var(--sheet)!important;font-weight:600}
.seg button[aria-pressed="true"] .ll,.seg button[aria-pressed="true"] .sl{color:var(--sheet)!important}
.controls .bsel.osel{background-color:var(--inv);color:var(--sheet);border-color:var(--inv);font-weight:600;background-image:linear-gradient(45deg,transparent 50%,var(--sheet) 50%),linear-gradient(135deg,var(--sheet) 50%,transparent 50%)}

.band .bigsel{padding-top:3px!important;padding-bottom:3px!important;font-size:14.5px!important;line-height:1.3!important;min-height:0!important;border-radius:14px 14px 0 0!important}

.controls .opts{background:var(--bg);border-radius:999px;padding:3px;gap:3px!important;align-items:center}

.nextbun{border-radius:999px 0 0 999px!important}.nextbun.prevbun{border-radius:0 999px 999px 0!important}
.nextbun{background:transparent!important;color:var(--accent)!important}.nextbun.prevbun{align-items:flex-start;text-align:left}

.speak.all[data-playbundle]:not([data-chain]){border-radius:0 999px 999px 0!important}

body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6}

/* title banner: Laos (That Luang, Mekong, palms, dok champa); day art in light theme, dusk art in dark theme, edges fade into the page */
:root{--hd-img:url(header-day.svg);--hd-ov:linear-gradient(90deg,rgba(243,244,242,.94) 0%,rgba(243,244,242,.7) 40%,rgba(243,244,242,0) 78%);--hd-fg:var(--ink);--hd-mut:var(--muted);--hd-lo:var(--accent);--hd-sh:0 1px 6px rgba(255,255,255,.6);--hd-pill:rgba(255,255,255,.32)}

header{position:relative;isolation:isolate;padding:22px 20px 18px;min-height:120px;color:var(--hd-fg)}
header::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:16px;background:var(--hd-ov),var(--hd-img) 70% 50%/cover no-repeat;
  -webkit-mask-image:linear-gradient(to bottom,#000 62%,transparent 100%),linear-gradient(to right,#000 85%,transparent 100%);-webkit-mask-composite:source-in;mask-image:linear-gradient(to bottom,#000 62%,transparent 100%),linear-gradient(to right,#000 85%,transparent 100%);mask-composite:intersect}
header .eyebrow{color:var(--hd-mut);padding-left:.45em}

header .stats{align-self:flex-end;background:var(--hd-pill);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);box-shadow:0 1px 3px rgba(0,0,0,.05)}
.brand{display:flex;flex-direction:column;gap:4px;min-width:0}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:600}
h1{font-family:var(--display);font-size:clamp(30px,6vw,40px);line-height:1.15;margin:0;text-wrap:balance}

.stats{display:flex;gap:14px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

.search{position:relative}
.search input{width:100%;border:1px solid var(--line);background:var(--sheet);color:var(--ink);border-radius:8px;padding:5px 10px 5px 30px;font:inherit;font-size:13px;line-height:1.4}

.groups{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}

.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.band{background:var(--accent-soft);padding:18px 20px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px;border-bottom:1px solid var(--line)}

.controls{display:flex;flex-wrap:wrap;gap:8px;padding:14px 20px;border-bottom:1px solid var(--line);align-items:center;justify-content:space-between}
.seg{display:flex;background:var(--bg);border-radius:999px;padding:3px;gap:2px;max-width:100%}
.seg button{border:0;background:transparent;padding:6px 13px;border-radius:999px;font-size:14px;color:var(--muted);font-weight:500;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--sheet);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.14)}
.seg-label{font-size:12.5px;color:var(--muted);padding:6px 4px 6px 10px;align-self:center;white-space:nowrap}
.controls{gap:6px}.controls .seg button{font-size:12px;padding:4px 9px}.controls .seg-label{font-size:11px;padding:4px 2px 4px 8px}.controls .bsel{font-size:12px;padding:5px 26px 5px 11px}.controls .bsel.osel{flex:0 0 auto;width:auto;min-width:0;max-width:none;padding-right:24px}.controls .bsel:not(.osel){order:5;flex:1 1 100%}.controls>.seg{margin-right:auto}
.bsel{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:7px 30px 7px 14px;font-size:14px;max-width:100%;min-width:0;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 16px) 52%,calc(100% - 11px) 52%;background-size:5px 5px;background-repeat:no-repeat}
.body{padding:18px 20px 22px;display:flex;flex-direction:column;gap:16px}
.meter{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{flex:1;height:6px;background:var(--bg);border-radius:6px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.bhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;padding-top:4px}
.bhead .bid{font-family:var(--display);font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--accent);background:var(--accent-soft);padding:2px 8px;border-radius:999px}

.bhead .bw{font-size:15px;color:var(--muted)}
.bintro{margin:0;font-size:13.5px;color:var(--muted)}
/* v2.12 RYU: a short last row is centered (flex wrap + container queries give the same columns as the old grid) */
.cardsw{container:cards/inline-size}.cards{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}.cards>*{flex:0 0 100%;min-width:0;box-sizing:border-box}
@container cards (min-width:350px){html:not(.tab) .cards>*{flex-basis:calc((100% - 10px)/2)}}@container cards (min-width:530px){html:not(.tab) .cards>*{flex-basis:calc((100% - 20px)/3)}}@container cards (min-width:710px){html:not(.tab) .cards>*{flex-basis:calc((100% - 30px)/4)}}@container cards (min-width:890px){html:not(.tab) .cards>*{flex-basis:calc((100% - 40px)/5)}}@container cards (min-width:1070px){html:not(.tab) .cards>*{flex-basis:calc((100% - 50px)/6)}}@container cards (min-width:1250px){html:not(.tab) .cards>*{flex-basis:calc((100% - 60px)/7)}}@container cards (min-width:1430px){html:not(.tab) .cards>*{flex-basis:calc((100% - 70px)/8)}}

.card{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden;min-width:0;background:var(--sheet)}

.card>.face{flex:1 0 auto}.card-foot{margin-top:auto;flex:none;white-space:nowrap;display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding:5px 6px 5px 12px;gap:8px}

.speak{border:1px solid var(--line);background:var(--sheet);border-radius:999px;width:32px;height:32px;display:grid;place-items:center;flex:0 0 auto;color:var(--ink)}
html.audwait .speak,html.audwait [data-playcards],html.audwait [data-playbundle]{opacity:.35;pointer-events:none}
#audwait{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:50;display:flex;align-items:center;gap:8px;background:var(--ink);color:var(--bg);padding:7px 14px;border-radius:999px;font-size:13px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.2)}

@keyframes bootspin{to{transform:rotate(360deg)}}
.speak:hover{border-color:var(--accent);color:var(--accent)}

.line.playing,.card.playing{box-shadow:0 0 0 2px var(--accent)}

.dlg-tools{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.player{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;align-items:center;justify-content:center;gap:12px;background:var(--ink);color:var(--bg);font-size:14px;padding:7px max(16px,env(safe-area-inset-right,0px)) calc(7px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}

.player{gap:8px;font-size:12px}.player .t{margin-right:4px}
.player button{height:26px;padding:0 11px;font-size:11.5px;line-height:1}
body.has-player .wrap{padding-bottom:110px}

.line.g{background:var(--raise);margin-right:10%}

@media (max-width:560px){.pair{grid-template-columns:1fr}.pair .vs{justify-self:center}}
.quiz{display:flex;flex-direction:column;gap:14px;max-width:640px}
.q-top{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;gap:8px}
.q-type{font-size:12px;letter-spacing:.06em;color:var(--accent);font-weight:700}

.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
